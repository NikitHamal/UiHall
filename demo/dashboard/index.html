<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln — sales analytics · built with the UI Hall skill</title>
<!--
  Built with the uihall skill:
    brief:      design_brief("analytics dashboard for a SaaS product", platform=web)
    related originals: ORG-0001 (dark shell, grouped sidebar, the orange "tile" bar chart built from small squares,
                          Weekly/Monthly/Yearly switch, transactions table with status pills, one orange action)
                ORG-0577 (KPI strip across the top separated by hairlines, number + label + context)
                ORG-0297 (one hero metric tile with the number at 3× the rest)
    patterns:   Sidebar workspace shell · Metric grid · One hero number · Dense data table with quiet chrome · Segmented range control
    palette:    #2C2A2B / #202020 surfaces, text #EBEBEC (12:1), accent fill #B74F21 (white text 5.1:1),
                accent as text/marks #DB7850 (check_contrast fix)
-->
<link rel="stylesheet" href="../../assets/css/fonts-v2.css">
<style>
:root{--bg:#151415;--side:#1A191A;--s1:#202020;--s2:#2A2829;--s3:#353334;--line:rgba(235,235,236,.07);--text:#EBEBEC;--t2:#A3A0A1;--t3:#8E8A8B;
  --acc:#B74F21;--acc-t:#DB7850;--ok:#4CC38A;--warn:#E5B94E;--bad:#E5675C;
  --sans:'Inter Tight',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:auto 1fr;overflow:hidden}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
aside{width:244px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;transition:width .45s var(--ease);overflow:hidden}
body.mini aside{width:68px}
.team{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--s1);margin-bottom:14px;white-space:nowrap}
.team i{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(135deg,#DB7850,#B74F21);display:grid;place-items:center;font:700 14px var(--sans);font-style:normal;color:#fff}
.team small{display:block;color:var(--t3);font-size:11.5px}
.grp{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:14px 10px 6px;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:10px;color:var(--t2);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{background:var(--s1);color:var(--text)}
.nav a[aria-current]{background:rgba(183,79,33,.16);color:var(--acc-t)}
.nav a .b{margin-left:auto;font:500 11px var(--mono);background:var(--s2);color:var(--t2);padding:2px 7px;border-radius:999px}
body.mini .nav a span,body.mini .grp,body.mini .team div,body.mini .nav a .b,body.mini .upg{opacity:0}
.upg{margin-top:auto;min-width:218px;padding:14px;border-radius:14px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--t2);transition:opacity .2s}
.upg b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.upg a{color:var(--acc-t);text-decoration:none}

/* main */
main{overflow-y:auto;height:100dvh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;background:rgba(21,20,21,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--t2);transition:background .2s}
.ib:hover{background:var(--s1);color:var(--text)}
.crumb{color:var(--t3)}.crumb b{color:var(--text);font-weight:500}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;width:280px;padding:0 10px;border-radius:10px;background:var(--s1);color:var(--t3)}
.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.av{width:32px;height:32px;border-radius:50%;background:url(../../assets/thumb/ORG-0197.webp) center/cover;box-shadow:0 0 0 2px var(--s2)}
.wrap{padding:24px;display:grid;gap:16px;max-width:1440px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hd h1{margin:0;font:400 38px/1 var(--serif);letter-spacing:-.01em}
.hd p{margin:6px 0 0;color:var(--t2)}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-weight:500;transition:transform .3s var(--spring),filter .2s}
.btn:active{transform:scale(.96)}
.btn.acc{background:var(--acc);color:#fff}.btn.acc:hover{filter:brightness(1.1)}
.btn.gh{background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);color:var(--t2)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.kpi{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:end}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi small{grid-column:1/-1;color:var(--t2);font-size:12.5px}
.kpi b{font:600 26px/1 var(--sans);letter-spacing:-.03em}
.kpi em{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--ok)}.kpi em.d{color:var(--bad)}
.kpi svg{width:76px;height:28px}
.kpi svg path{fill:none;stroke:var(--acc-t);stroke-width:1.6;stroke-linecap:round}

.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
.card{border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);padding:18px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{margin:0;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:10px;background:var(--s2)}
.seg button{position:relative;z-index:1;height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;color:var(--t2);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg .th{position:absolute;top:3px;height:28px;border-radius:8px;background:var(--s3);transition:left .35s var(--ease),width .35s var(--ease)}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.big b{font:600 40px/1 var(--sans);letter-spacing:-.04em}
.big span{color:var(--ok);font-size:13px}
.tiles{position:relative;display:grid;grid-template-columns:28px repeat(var(--cols),1fr);gap:4px;height:240px}
.axis{display:flex;flex-direction:column;justify-content:space-between;color:var(--t3);font:10.5px var(--mono);padding-bottom:20px}
.col{display:flex;flex-direction:column-reverse;gap:3px;position:relative;cursor:crosshair}
.col i{display:block;flex:1;border-radius:2px;background:var(--s2);transition:background .5s var(--ease)}
.col i.on{background:var(--acc)}
.col i.on.top{background:var(--acc-t)}
.col:hover i.on{background:var(--acc-t)}
.col span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--t3);font:10.5px var(--mono)}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;background:#0E0E0E;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);font-size:12px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease);white-space:nowrap;z-index:3}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font:600 14px var(--sans)}

.hero{display:grid;gap:4px;padding:18px;border-radius:14px;background:linear-gradient(160deg,rgba(183,79,33,.28),rgba(183,79,33,.06));box-shadow:inset 0 0 0 1px rgba(219,120,80,.25);margin-bottom:14px}
.hero small{color:var(--t2)}
.hero b{font:600 54px/1 var(--sans);letter-spacing:-.045em}
.hero b sup{font-size:22px;color:var(--acc-t);vertical-align:top;margin-left:2px}
.brk{display:grid;gap:12px}
.brk div{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13px;color:var(--t2)}
.brk .bar{height:8px;border-radius:8px;background:var(--s2);overflow:hidden}
.brk .bar i{display:block;height:100%;border-radius:inherit;background:var(--acc-t);transform-origin:left;transform:scaleX(0);transition:transform 1s var(--ease)}
.brk em{font-style:normal;text-align:right;color:var(--text)}

table{width:100%;border-collapse:collapse}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--t3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th[aria-sort]::after{content:' ↓';color:var(--acc-t)}th[aria-sort=ascending]::after{content:' ↑'}
td{padding:0 12px;height:48px;border-bottom:1px solid var(--line);white-space:nowrap}
tr{transition:background .15s}tbody tr:hover{background:rgba(255,255,255,.025)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.who i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 11px var(--sans);font-style:normal;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(76,195,138,.13)}.pill.warn{color:var(--warn);background:rgba(229,185,78,.13)}.pill.bad{color:var(--bad);background:rgba(229,103,92,.13)}
.tsearch{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--s2);color:var(--t3);width:220px}
.tsearch input{outline:none;width:100%;color:var(--text)}
.empty{padding:36px;text-align:center;color:var(--t3)}
.credit{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--t3);font-size:12.5px;padding:8px 2px 24px}
.credit a{color:var(--acc-t);text-decoration:none}
.credit .refs{display:flex;gap:8px;align-items:center}
.credit img{width:34px;height:34px;border-radius:8px;object-fit:cover}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(4){border-top:1px solid var(--line)}}
@media(max-width:760px){aside{display:none}body{grid-template-columns:1fr}.search{display:none}.tablewrap{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

/* --- app additions --- */
.page{animation:pin .45s var(--ease) both}@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{height:40px;padding:0 14px;color:var(--t2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--acc-t)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--s1);box-shadow:-30px 0 60px -20px rgba(0,0,0,.6),inset 1px 0 0 var(--line);transform:translateX(105%);transition:transform .5s var(--ease);z-index:40;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .body{padding:20px;overflow-y:auto;display:grid;gap:16px;align-content:start}
.dscrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .4s;z-index:39}
.dscrim.on{opacity:1;pointer-events:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv span{color:var(--t2)}
.tl{display:grid;gap:14px;padding-left:18px;border-left:1px solid var(--line)}
.tl div{position:relative;font-size:13.5px}.tl div::before{content:'';position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--acc-t);box-shadow:0 0 0 3px var(--s1)}
.tl small{display:block;color:var(--t3);font-size:12px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 0;color:var(--t2);font-size:13px}
.pager div{display:flex;gap:6px}
.chipf{display:flex;gap:6px;flex-wrap:wrap}
.chipf button{height:30px;padding:0 12px;border-radius:999px;background:var(--s2);color:var(--t2);font-size:12.5px;font-weight:500}
.chipf button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}@media(max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
.acc{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .2s,transform .3s var(--spring)}
.acc:hover{box-shadow:inset 0 0 0 1px rgba(219,120,80,.4);transform:translateY(-2px)}
.acc .top{display:flex;align-items:center;gap:10px}.acc .top i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--sans);font-style:normal;color:#fff}
.acc small{color:var(--t2)}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:var(--s2);transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:calc(var(--k)*40ms)}
.bars i.hi{background:var(--acc)}@keyframes grow{from{transform:scaleY(0)}}
.bars span{font:10.5px var(--mono);color:var(--t3)}
.funnel{display:grid;gap:10px}.funnel div{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:13px;color:var(--t2)}
.funnel b{height:28px;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc-t));transform-origin:left;animation:growx .9s var(--ease) both}
@keyframes growx{from{transform:scaleX(0)}}
.cohort{display:grid;grid-template-columns:70px repeat(8,1fr);gap:3px;font:11px var(--mono)}
.cohort span{color:var(--t3);display:grid;place-items:center;height:28px}
.cohort i{height:28px;border-radius:4px;display:grid;place-items:center;font-style:normal;color:#fff;font-size:10.5px}
.input{height:38px;padding:0 12px;border-radius:10px;background:var(--s2);color:var(--text);outline:none;width:100%}
.input:focus{box-shadow:0 0 0 2px var(--acc-t)}
.modal{position:fixed;left:50%;top:50%;width:min(460px,92vw);translate:-50% -46%;opacity:0;pointer-events:none;background:var(--s1);border-radius:20px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 1px var(--line);padding:22px;z-index:41;transition:opacity .3s,translate .45s var(--spring)}
.modal.on{opacity:1;pointer-events:auto;translate:-50% -50%}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;padding:10px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:13px;z-index:60;transition:opacity .3s,translate .45s var(--spring);pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
.cmdk{position:fixed;left:50%;top:14vh;width:min(560px,92vw);translate:-50% -10px;opacity:0;pointer-events:none;background:var(--s1);border-radius:16px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 1px var(--line);z-index:42;transition:opacity .25s,translate .35s var(--spring);overflow:hidden}
.cmdk.on{opacity:1;pointer-events:auto;translate:-50% 0}
.cmdk input{height:52px;width:100%;padding:0 18px;background:none;outline:none;font-size:15px;border-bottom:1px solid var(--line)}
.cmdk .res{max-height:320px;overflow:auto;padding:6px}
.cmdk .res button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:14px;color:var(--t2)}
.cmdk .res button[aria-selected=true]{background:var(--s2);color:var(--text)}
.nav a{cursor:pointer}
.search{cursor:pointer}
</style>
</head>
<body>
<aside aria-label="Navigation">
  <div class="team"><i>K</i><div><b>Kiln</b><small>Northwind · Pro</small></div></div>
  <div class="grp">Main</div>
  <nav class="nav">
    <a data-page="overview"><svg class="i" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg><span>Overview</span></a>
    <a data-page="reports"><svg class="i" viewBox="0 0 20 20"><path d="M3 16 8 10l3 3 6-8"/></svg><span>Reports</span></a>
    <a data-page="transactions"><svg class="i" viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h7"/></svg><span>Transactions</span><em class="b" id="txCount">24</em></a>
  </nav>
  <div class="grp">Customers</div>
  <nav class="nav">
    <a data-page="accounts"><svg class="i" viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2.5 16a5.5 5.5 0 0 1 11 0M13 4.5a3 3 0 0 1 0 5.5M15 16a5 5 0 0 0-2-4"/></svg><span>Accounts</span></a>
  </nav>
  <div class="grp">Settings</div>
  <nav class="nav"><a data-page="settings"><svg class="i" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg><span>Workspace</span></a></nav>
  <div class="upg"><b>Forecasts are here</b>Project next quarter from your data. <a data-page="reports">Try it →</a></div>
</aside>
<main>
  <div class="top">
    <button class="ib" id="mini" aria-label="Collapse sidebar"><svg class="i" viewBox="0 0 20 20"><rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M8 3.5v13"/></svg></button>
    <span class="crumb">Dashboard / <b id="crumb">Overview</b></span>
    <button class="search" id="openK"><svg class="i" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg>Search or jump to…<kbd>⌘K</kbd></button>
    <button class="ib" aria-label="Notifications" id="bell"><svg class="i" viewBox="0 0 20 20"><path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 1.5h-13zM8.5 17.5h3"/></svg></button>
    <span class="av" aria-hidden="true"></span>
  </div>
  <div class="wrap" id="page"></div>
</main>
<div class="dscrim" id="dscrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="cmdk" id="cmdk" role="dialog" aria-label="Command menu"><input id="kq" placeholder="Type a command or search…" autocomplete="off"><div class="res" id="kres"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=v=>'$'+Math.round(v).toLocaleString('en-US');
const C=['#DB7850','#7C6FE0','#4CC38A','#E5B94E','#4AA3DF','#E5675C'];
const ST=[['Paid','ok'],['Pending','warn'],['Refunded','bad']];

 if(act==='invite'){modal(`<b style="font-size:17px">Invite to Northwind</b><p style="color:var(--t2);margin:6px 0 14px">They’ll get an email with a link to join.</p><input class="input" placeholder="name@company.com" id="inv"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn gh" data-close>Cancel</button><button class="btn acc" id="doinv">Send invite</button></div>`);$('#inv').focus();$('#doinv').onclick=()=>{const v=$('#inv').value.trim();if(!/@/.test(v)){$('#inv').style.boxShadow='0 0 0 2px var(--bad)';toast('Enter a valid email');return}closeAll();toast(`Invite sent to ${v}`)};return}
 const msg={export:'Export started — CSV in your inbox shortly',newreport:'New report created',receipt:'Receipt sent',save:'Workspace saved',upgrade:'Upgrade flow (prototype)',email:'Email drafted'}[act];if(msg){closeAll();toast(msg)}
});
/* command menu */
const CMDS=[['Go to Overview',()=>go('overview')],['Go to Reports',()=>go('reports')],['Go to Transactions',()=>go('transactions')],['Go to Accounts',()=>go('accounts')],['Go to Workspace settings',()=>go('settings')],['Invite a member',()=>{go('settings');setTimeout(()=>document.querySelector('[data-tab=Members]').click(),50)}],['Export transactions',()=>toast('Export started')],...ACCTS.map(a=>[`Open account · ${a.n}`,()=>{go('accounts');setTimeout(()=>document.querySelector(`[data-acct="${a.n}"]`)?.click(),80)}])];
let ksel=0;function kdraw(){const q=$('#kq').value.toLowerCase();const list=CMDS.filter(c=>c[0].toLowerCase().includes(q));ksel=Math.min(ksel,Math.max(0,list.length-1));$('#kres').innerHTML=list.map((c,i)=>`<button aria-selected="${i===ksel}" data-k="${CMDS.indexOf(c)}">${c[0]}</button>`).join('')||'<p class="empty">No commands</p>';return list}
function kopen(){$('#cmdk').classList.add('on');$('#dscrim').classList.add('on');$('#kq').value='';ksel=0;kdraw();setTimeout(()=>$('#kq').focus(),30)}
$('#openK').onclick=kopen;$('#kq').oninput=()=>{ksel=0;kdraw()};
$('#kres').onclick=e=>{const b=e.target.closest('[data-k]');if(b){closeAll();CMDS[+b.dataset.k][1]()}};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();kopen()}if(e.key==='Escape')closeAll();
 if($('#cmdk').classList.contains('on')){const list=kdraw();if(e.key==='ArrowDown'){ksel=(ksel+1)%list.length;kdraw();e.preventDefault()}if(e.key==='ArrowUp'){ksel=(ksel-1+list.length)%list.length;kdraw();e.preventDefault()}if(e.key==='Enter'&&list[ksel]){closeAll();list[ksel][1]()}}});
$('#mini').onclick=()=>document.body.classList.toggle('mini');
$('#bell').onclick=()=>drawer(`<header><b>Notifications</b>${X}</header><div class="body"><div class="tl"><div>Orbit AI upgraded to Team<small>2 min ago</small></div><div>Refund requested by Lea Martin<small>1 h ago</small></div><div>Weekly digest is ready<small>Yesterday</small></div></div></div>`);
go(['overview','reports','transactions','accounts','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'overview');
